# Voice Navigation Intent & Slot Schema
# Covers Firstclick HRMS and SalesPro CRM modules

intents:
  NAVIGATE:
    description: "Navigate to a specific screen or section in the app"
    slots:
      - target_screen
    examples:
      - "open {target_screen}"
      - "go to {target_screen}"
      - "take me to {target_screen}"
      - "show me {target_screen}"
      - "navigate to {target_screen}"
      - "switch to {target_screen}"
      - "view {target_screen}"
      - "bring up {target_screen}"
      - "open up {target_screen}"
      - "launch {target_screen}"
      - "jump over to {target_screen}"
      - "i need to check {target_screen}"
      - "open up the {target_screen} tab"
      - "display {target_screen} screen"
      - "head to {target_screen}"
      - "get me {target_screen}"
      - "let me see {target_screen}"
      - "route to {target_screen}"
      - "show {target_screen}"
      - "open {target_screen} page"

  SEARCH:
    description: "Search for records, entities, or queries within a screen or globally"
    slots:
      - query
      - target_screen
    examples:
      - "search for {query}"
      - "search {query} in {target_screen}"
      - "find {query}"
      - "find {query} inside {target_screen}"
      - "look for {query}"
      - "look up {query}"
      - "search employee {query}"
      - "find lead {query}"
      - "query {query} in {target_screen}"
      - "where is {query} located"
      - "find me details for {query}"
      - "locate {query} under {target_screen}"
      - "pull up records for {query}"
      - "filter search for {query}"
      - "search {query}"

  TOGGLE:
    description: "Enable, disable, or turn on/off app settings and module features"
    slots:
      - target_feature
      - value
    examples:
      - "turn {value} {target_feature}"
      - "{value} {target_feature}"
      - "enable {target_feature}"
      - "disable {target_feature}"
      - "switch {value} {target_feature}"
      - "toggle {target_feature}"
      - "can we {value} {target_feature}"
      - "set {target_feature} to {value}"
      - "make {target_feature} {value}"
      - "i want {target_feature} turned {value}"
      - "adjust settings for {target_feature}"

  FILTER:
    description: "Apply filters to lists, tables, or pipelines"
    slots:
      - filter_key
      - filter_value
    examples:
      - "filter by {filter_key} {filter_value}"
      - "show only {filter_value} {filter_key}"
      - "filter {filter_key} equal to {filter_value}"
      - "sort by {filter_key}"
      - "narrow down by {filter_key} {filter_value}"
      - "only display {filter_value} items for {filter_key}"
      - "arrange by {filter_key}"
      - "show items where {filter_key} is {filter_value}"

  CREATE:
    description: "Trigger creation or application modals/forms"
    slots:
      - target_item
    examples:
      - "create new {target_item}"
      - "add {target_item}"
      - "apply for {target_item}"
      - "new {target_item}"
      - "file a {target_item}"
      - "submit {target_item}"
      - "start a new {target_item}"
      - "fill out a {target_item}"
      - "i need to enter a {target_item}"
      - "record a new {target_item}"
      - "log a {target_item}"

  BACK:
    description: "Navigate back to the previous screen"
    slots: []
    examples:
      - "go back"
      - "previous screen"
      - "back"
      - "return to previous page"
      - "take me back"
      - "get out of here"
      - "return to where i was"
      - "take me one step back"
      - "exit current view"
      - "go to previous page"

  SCROLL:
    description: "Scroll the view in a specified direction"
    slots:
      - direction
    examples:
      - "scroll {direction}"
      - "move {direction}"
      - "go {direction}"
      - "page {direction}"
      - "scroll to {direction}"
      - "slide {direction}"
      - "pan {direction}"
      - "swipe {direction}"
      - "move view {direction}"

